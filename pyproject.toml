[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-trader-platform"
version = "0.1.0"
description = "Market intelligence for Telegram NFT gifts on TON"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "pydantic-settings==2.14.2",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.3",
  "sqlalchemy==2.0.46",
  "asyncpg==0.31.0",
  "alembic==1.18.4",
  "PyJWT==2.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.6",
  "aiosqlite==0.22.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
