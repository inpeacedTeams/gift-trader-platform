[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-trader-platform"
version = "0.1.0"
description = "Market intelligence for Telegram NFT gifts on TON"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "sqlalchemy>=2.0,<3", "asyncpg>=0.29,<1", "alembic>=1.14,<2", "PyJWT>=2.9,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1", "ruff>=0.8,<1", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
target-version = "py312"
