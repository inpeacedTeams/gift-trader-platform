services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gift_trader
      POSTGRES_USER: gift_trader
      POSTGRES_PASSWORD: gift_trader
    ports:
      - "5432:5432"
    volumes:
      - gift_trader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift_trader -d gift_trader"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-gift-trader-api}
      DATABASE_URL: postgresql+asyncpg://gift_trader:gift_trader@postgres:5432/gift_trader
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-604800}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      AI_REQUESTS_PER_HOUR: ${AI_REQUESTS_PER_HOUR:-30}
      AI_VERDICT_CACHE_SECONDS: ${AI_VERDICT_CACHE_SECONDS:-600}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-45}
      MARKET_SOURCES: ${MARKET_SOURCES:-tonnel,getgems}
      TONNEL_ENDPOINT: ${TONNEL_ENDPOINT:-https://gifts2.tonnel.network/api/pageGifts}
      TONNEL_HISTORY_ENDPOINT: ${TONNEL_HISTORY_ENDPOINT:-https://gifts2.tonnel.network/api/saleHistory}
      TONNEL_AUTH_DATA: ${TONNEL_AUTH_DATA:-}
      TRADE_SYNC_INTERVAL_SECONDS: ${TRADE_SYNC_INTERVAL_SECONDS:-900}
      TRADE_SYNC_ENABLED: ${TRADE_SYNC_ENABLED:-true}
      TONAPI_BASE_URL: ${TONAPI_BASE_URL:-https://tonapi.io}
      TONAPI_TOKEN: ${TONAPI_TOKEN:-}
      PORTALS_ENDPOINT: ${PORTALS_ENDPOINT:-https://portals-market.com/api/nfts/search}
      PORTALS_AUTH_DATA: ${PORTALS_AUTH_DATA:-}
      GETGEMS_COLLECTION_ADDRESSES: ${GETGEMS_COLLECTION_ADDRESSES:-}
      SOURCE_TIMEOUT_SECONDS: ${SOURCE_TIMEOUT_SECONDS:-20}
      SOURCE_RETRIES: ${SOURCE_RETRIES:-2}
      SOURCE_BACKOFF_SECONDS: ${SOURCE_BACKOFF_SECONDS:-0.5}
      MARKET_SYNC_INTERVAL_SECONDS: ${MARKET_SYNC_INTERVAL_SECONDS:-300}
      MARKET_SYNC_ENABLED: ${MARKET_SYNC_ENABLED:-true}
      PORTFOLIO_SYNC_INTERVAL_SECONDS: ${PORTFOLIO_SYNC_INTERVAL_SECONDS:-300}
      PORTFOLIO_SYNC_ENABLED: ${PORTFOLIO_SYNC_ENABLED:-true}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python -m app.db.migrate && python -m app.db.verify_schema && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  gift_trader_pg:
