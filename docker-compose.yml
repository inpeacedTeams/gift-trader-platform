services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gift_trader
      POSTGRES_USER: gift_trader
      POSTGRES_PASSWORD: gift_trader
    ports:
      - "5432:5432"
    volumes:
      - gift_trader_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gift_trader -d gift_trader"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gift_trader_pg:
