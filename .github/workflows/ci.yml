name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gift_trader
          POSTGRES_USER: gift_trader
          POSTGRES_PASSWORD: gift_trader
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U gift_trader -d gift_trader"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://gift_trader:gift_trader@localhost:5432/gift_trader
      MARKET_SYNC_ENABLED: "false"
      PORTFOLIO_SYNC_ENABLED: "false"
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: python -m app.db.migrate
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
